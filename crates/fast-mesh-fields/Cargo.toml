[package]
name = "fast-mesh-fields"
description = "Signed distance fields between editable triangle meshes (part of fast-mesh-wasm)"
keywords = ["sdf", "mesh", "geometry", "distance", "3d"]
categories = ["graphics", "algorithms"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Multithreaded hot loops; results are bit-identical with and without it.
parallel = ["fast-mesh-store/parallel", "fast-mesh-bvh/parallel", "fast-mesh-query/parallel"]

[dependencies]
fast-mesh-store.workspace = true
fast-mesh-bvh.workspace = true
fast-mesh-query.workspace = true

[dev-dependencies]
fast-mesh-store = { workspace = true, features = ["test-counters"] }
criterion = { version = "0.8.2", default-features = false }

[[bench]]
name = "fields"
harness = false
