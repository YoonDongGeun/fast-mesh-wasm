[package]
name = "fast-mesh-cli"
description = "Headless `fast-mesh` command line: repair, measure, boolean and convert over mesh files (part of fast-mesh-wasm)"
keywords = ["mesh", "repair", "stl", "cli", "3d"]
categories = ["graphics", "command-line-utilities"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Multithreaded engine hot loops; results are bit-identical with and without it.
parallel = ["fast-mesh-ops/parallel", "fast-mesh-bvh/parallel", "fast-mesh-query/parallel", "fast-mesh-store/parallel"]

[dependencies]
fast-mesh-store.workspace = true
fast-mesh-bvh.workspace = true
fast-mesh-query.workspace = true
fast-mesh-ops.workspace = true

[lib]
name = "fast_mesh_cli"
path = "src/lib.rs"

[[bin]]
name = "fast-mesh"
path = "src/main.rs"
# The `fast-mesh` library crate documents under the same name: without this,
# `cargo doc --workspace` (the Pages site) reports an output collision.
doc = false
