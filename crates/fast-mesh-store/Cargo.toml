[package]
name = "fast-mesh-store"
description = "Editable triangle mesh storage with transactional undo/redo (part of fast-mesh-wasm)"
keywords = ["mesh", "geometry", "undo", "3d"]
categories = ["graphics", "data-structures"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Lets the engine run hot loops on rayon's thread pool (see `par`). Results
# are bit-identical with and without it.
parallel = ["dep:rayon"]
# Exposes `par::parallel_entries` to other crates' tests.
test-counters = []

[dependencies]
rayon = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1.12.0"
