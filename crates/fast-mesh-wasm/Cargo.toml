[package]
name = "fast-mesh-wasm"
description = "WebAssembly bindings for fast-mesh (published to npm, not crates.io)"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Exports `__test_panic()`, which panics, for the TypeScript poisoning test,
# and with `threads` `__test_panic_pool()` / `__test_trap_pool()`, which crash a
# pool thread, for the browser check.
# Only `node scripts/build-wasm.mjs --test` (or `FAST_MESH_TEST_BUILD=1`), run
# by the package's `test` script, enables it; release builds never do.
test-panic = []
# Multithreaded engine hot loops (rayon); results are bit-identical without it.
parallel = ["fast-mesh-scene/parallel", "fast-mesh-ops/parallel"]
# The threaded artifact (`node scripts/build-wasm.mjs --threads`, pinned
# nightly, wasm atomics): `parallel` plus `initThreadPool`, which starts
# rayon's pool on Web Workers sharing this module's memory.
# Its pool threads report a panic or trap to the scene (`watchPoolCrashes`).
threads = ["parallel", "dep:wasm-bindgen-rayon", "dep:rayon"]

[dependencies]
fast-mesh.workspace = true
fast-mesh-scene.workspace = true
fast-mesh-bvh.workspace = true
fast-mesh-store.workspace = true
fast-mesh-query.workspace = true
fast-mesh-fields.workspace = true
fast-mesh-ops.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
