[package]
name = "fast-mesh-query"
description = "Raycast, closest-point and region queries for editable triangle meshes (part of fast-mesh-wasm)"
keywords = ["raycast", "mesh", "geometry", "bvh", "3d"]
categories = ["graphics", "algorithms"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Multithreaded hot loops; results are bit-identical with and without it.
parallel = ["fast-mesh-store/parallel", "fast-mesh-bvh/parallel"]
# The out-of-memory fault hook as a public test helper, so that crates
# depending on this one can fail its reservations from their own tests.
fault-injection = []

[dependencies]
fast-mesh-store.workspace = true
fast-mesh-bvh.workspace = true
robust = "1.2.0"

[dev-dependencies]
fast-mesh-store = { workspace = true, features = ["test-counters"] }
proptest = "1.12.0"
criterion = { version = "0.8.2", default-features = false }

[[bench]]
name = "query"
harness = false
