[package]
name = "fast-mesh-ops"
description = "Mesh repair for editable triangle meshes: analysis, welding, orientation and hole filling (part of fast-mesh-wasm)"
keywords = ["mesh", "repair", "geometry", "hole-filling", "3d"]
categories = ["graphics", "algorithms"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Multithreaded hot loops; results are bit-identical with and without it.
parallel = ["fast-mesh-store/parallel", "fast-mesh-bvh/parallel", "fast-mesh-query/parallel"]

[dependencies]
fast-mesh-store.workspace = true
fast-mesh-bvh.workspace = true
fast-mesh-query.workspace = true

[dev-dependencies]
fast-mesh-store = { workspace = true, features = ["test-counters"] }
proptest = "1.12.0"
criterion = { version = "0.8.2", default-features = false }

[[bench]]
name = "ops"
harness = false
