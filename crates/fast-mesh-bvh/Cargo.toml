[package]
name = "fast-mesh-bvh"
description = "Incrementally updatable bounding volume hierarchy for editable triangle meshes (part of fast-mesh-wasm)"
keywords = ["bvh", "mesh", "geometry", "collision", "3d"]
categories = ["graphics", "data-structures"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Multithreaded hot loops; results are bit-identical with and without it.
parallel = ["fast-mesh-store/parallel"]

[dependencies]
fast-mesh-store.workspace = true

[dev-dependencies]
fast-mesh-store = { workspace = true, features = ["test-counters"] }
proptest = "1.12.0"
criterion = { version = "0.8.2", default-features = false }

[[bench]]
name = "bvh"
harness = false
