[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/YoonDongGeun/fast-mesh-wasm"
authors = ["DongGeun Yoon"]

[workspace.dependencies]
fast-mesh = { path = "crates/fast-mesh", version = "0.1.0" }
fast-mesh-store = { path = "crates/fast-mesh-store", version = "0.1.0" }
fast-mesh-bvh = { path = "crates/fast-mesh-bvh", version = "0.1.0" }
fast-mesh-query = { path = "crates/fast-mesh-query", version = "0.1.0" }
fast-mesh-fields = { path = "crates/fast-mesh-fields", version = "0.1.0" }
fast-mesh-ops = { path = "crates/fast-mesh-ops", version = "0.1.0" }
fast-mesh-scene = { path = "crates/fast-mesh-scene", version = "0.1.0" }
# Must match the installed wasm-bindgen-cli exactly. Bump both together.
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
