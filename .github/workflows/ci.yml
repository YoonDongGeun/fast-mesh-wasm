name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the `wasm-bindgen` version pinned in the root Cargo.toml.
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The `parallel` feature: scene and ops turn it on in every engine crate
      # they depend on. Run once more on one thread to cover rayon's
      # single-thread pool.
      - run: cargo clippy --workspace --all-targets --features fast-mesh-scene/parallel,fast-mesh-ops/parallel -- -D warnings
      - run: cargo test --workspace --features fast-mesh-scene/parallel,fast-mesh-ops/parallel
      - run: cargo test --workspace --features fast-mesh-scene/parallel,fast-mesh-ops/parallel
        env:
          RAYON_NUM_THREADS: 1
      - name: rayon stays out of the default build
        shell: bash
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu wasm32-unknown-unknown; do
            # Captured first, so a failing `cargo tree` fails the step.
            deps=$(cargo tree --workspace -e normal,build --prefix none --target "$target")
            if grep -q '^rayon' <<<"$deps"; then
              echo "rayon is a dependency without the parallel feature ($target)"
              exit 1
            fi
          done
      # The package job builds the scene crate for wasm through fast-mesh-wasm;
      # these also build the engine crates on their own (own feature sets).
      - run: cargo build --release --target wasm32-unknown-unknown -p fast-mesh-scene
      - run: cargo build --release --target wasm32-unknown-unknown -p fast-mesh-fields
      - run: cargo bench -p fast-mesh-bvh --no-run
      - run: cargo bench -p fast-mesh-query --no-run
      - run: cargo bench -p fast-mesh-scene --no-run
      - run: cargo bench -p fast-mesh-fields --no-run

  package:
    name: Build and check the npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check exports and types (publint, attw)
        run: pnpm check:pkg
      - name: Build the Vite example (browser entry)
        run: pnpm --filter fast-mesh-wasm-example-vite build
      - name: Type-check and build the WebGPU example (Scene API, no 3D library; ?worker uses the Worker scene)
        run: |
          pnpm --filter fast-mesh-wasm-example-webgpu build
          # Vite must have picked up the package's default Worker URL and emitted the Worker script.
          ls examples/webgpu/dist/assets/worker-entry-*.js
      - name: Bundle and run the webpack server example (Node entry, sideEffects)
        run: |
          pnpm --filter fast-mesh-wasm-example-webpack-node build
          node examples/webpack-node/dist/main.cjs
      - run: pnpm --filter fast-mesh-wasm pack --pack-destination "${{ github.workspace }}/pack"
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: pack/*.tgz
      # Needs the release build, so it runs before the test script replaces it.
      - name: Run the Scene benchmarks (short run, release build)
        timeout-minutes: 20
        run: |
          pnpm --filter fast-mesh-wasm bench -- --quick
          pnpm --filter fast-mesh-wasm bench -- --worker --quick
      # Last: the test script rebuilds the package with the `test-panic` feature,
      # which must not reach the packed tarball above.
      - name: Test the package (test build)
        run: pnpm --filter fast-mesh-wasm test

  install:
    name: ${{ matrix.pm }} · ${{ matrix.os }} · node ${{ matrix.node }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        pm: [npm, pnpm, bun]
        node: [24]
        include:
          - { os: ubuntu-latest, pm: npm, node: 22 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: pack
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v6
      - if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@v2
      - run: node scripts/smoke.mjs --tarball pack ${{ matrix.pm }}
