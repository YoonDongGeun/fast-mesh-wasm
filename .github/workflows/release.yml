name: Release

# On every push to main, changesets/action either:
#  - opens/updates a "Version Packages" PR when there are pending changesets, or
#  - publishes to npm when that PR has just been merged (no changesets left, new version not on npm yet).
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push tags, create GitHub releases
  pull-requests: write # open the Version Packages PR
  id-token: write # npm Trusted Publishing (OIDC) + provenance, no NPM_TOKEN needed

env:
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  release:
    if: github.repository == 'YoonDongGeun/fast-mesh-wasm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
