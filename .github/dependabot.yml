version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # wasm-bindgen must be bumped together with WASM_BINDGEN_VERSION in the workflows.
      - dependency-name: wasm-bindgen

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
