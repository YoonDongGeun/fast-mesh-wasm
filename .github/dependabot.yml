version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # wasm-bindgen must be bumped together with WASM_BINDGEN_VERSION in the workflows.
      - dependency-name: wasm-bindgen

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-dev:
        dependency-type: development
    ignore:
      # @types/node tracks the lowest supported Node.js version (`engines` in package.json).
      # Raise its major together with that minimum, not on its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
